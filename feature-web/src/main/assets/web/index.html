<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LifeHub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
  <aside id="side" hidden>
    <div class="brand"><img src="/favicon.svg" alt=""><span>LifeHub</span></div>
    <nav id="tabs">
      <button data-tab="calendar"></button>
      <button data-tab="notes"></button>
      <button data-tab="money"></button>
    </nav>
    <div class="side-foot">
      <div id="link" class="link"><span class="dot"></span><span></span></div>
      <button id="theme" class="ghost"></button>
      <button id="logout" class="ghost"></button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>
</body>
</html>
