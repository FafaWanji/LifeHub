# Every push to the "beta" branch: unit tests, then "LifeHub Beta" APKs as a GitHub pre-release.
# Pre-releases are never offered by the in-app updater (it only reads the latest full release).
name: Beta build

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta
  cancel-in-progress: true

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Debug build
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Beta APKs
        run: bash ./gradlew assembleBeta --stacktrace

      - name: Room schemas unchanged
        # The build regenerates schemas/*.json; a difference means a committed schema is out of date (printed for fixing)
        run: |
          git status --porcelain -- '*/schemas/*'
          git diff -- '*/schemas/*'
          git diff --quiet -- '*/schemas/*' && [ -z "$(git status --porcelain -- '*/schemas/*')" ] || echo "::warning::Room schema files changed during the build – commit the regenerated ones"

      - name: Name the APKs
        run: |
          mkdir -p out
          for f in app/build/outputs/apk/beta/*.apk; do
            cp "$f" "out/lifehub-beta-${GITHUB_RUN_NUMBER}-$(basename "$f" .apk | sed 's/^app-//; s/-beta$//').apk"
          done
          ls -la out

      - name: Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: LifeHub Beta ${{ github.run_number }}
          prerelease: true
          body: |
            Beta build of `${{ github.sha }}` from the `beta` branch.

            Installs as a separate app ("LifeHub Beta") next to the normal LifeHub – move data with a backup if you want it there.
            Pick the APK for your phone: arm64-v8a for almost all current phones.
          files: out/*.apk
